# XcodeGen Project Definition for PKMReader
# Generate .xcodeproj with: xcodegen generate

name: PKMReader

options:
  bundleIdPrefix: by.spaceba.pkm
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  developmentLanguage: en
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

packages:
  Textual:
    url: https://github.com/gonzalezreal/textual
    from: "0.1.0"
  Amplify:
    url: https://github.com/aws-amplify/amplify-swift
    from: "2.40.0"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"

settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    STRING_CATALOG_GENERATE_SYMBOLS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  PKMReader:
    type: application
    platform: iOS
    sources:
      - path: PKMReader
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        DEVELOPMENT_TEAM: "TPXD65QGEQ"
        CODE_SIGN_IDENTITY: "Apple Development"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: by.spaceba.pkm.reader
        PRODUCT_NAME: PKMReader
        INFOPLIST_KEY_CFBundleDisplayName: Sal
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_PREVIEWS: YES
    entitlements:
      path: PKMReader/PKMReader.entitlements
    dependencies:
      - package: Textual
      - package: Amplify
        product: Amplify
      - package: Amplify
        product: AWSCognitoAuthPlugin

  PKMReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PKMReaderTests
        excludes:
          - "**/.DS_Store"
          - "**/__Snapshots__/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.spaceba.pkm.reader.tests
        PRODUCT_NAME: PKMReaderTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PKMReader.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PKMReader"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
    dependencies:
      - target: PKMReader
      - package: SnapshotTesting

  PKMReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PKMReaderUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.spaceba.pkm.reader.uitests
        PRODUCT_NAME: PKMReaderUITests
        TEST_TARGET_NAME: PKMReader
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
      configs:
        # Use Swift 5 language mode for UI tests - XCTest APIs aren't fully annotated for Swift 6 concurrency
        Debug:
          SWIFT_VERSION: "5"
        Release:
          SWIFT_VERSION: "5"
    dependencies:
      - target: PKMReader

schemes:
  PKMReader:
    build:
      targets:
        PKMReader: all
        PKMReaderTests: [test]
        PKMReaderUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-com.apple.CoreData.ConcurrencyDebug 1": true
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - PKMReader
      targets:
        - name: PKMReaderTests
          parallelizable: true
          randomExecutionOrder: true
        - name: PKMReaderUITests
          parallelizable: false
          randomExecutionOrder: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
