# XcodeGen Project Definition for PKMSync
# Generate .xcodeproj with: xcodegen generate

name: PKMSync

options:
  bundleIdPrefix: by.spaceba.pkm
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  developmentLanguage: en
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  PKMSync:
    type: application
    platform: macOS
    sources:
      - path: PKMSync
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        DEVELOPMENT_TEAM: "TPXD65QGEQ"
        PRODUCT_BUNDLE_IDENTIFIER: by.spaceba.pkm.sync
        PRODUCT_NAME: PKMSync
        INFOPLIST_KEY_CFBundleDisplayName: "Sal Sync"
        INFOPLIST_KEY_LSUIElement: true
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  PKMSyncTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PKMSyncTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.spaceba.pkm.sync.tests
        PRODUCT_NAME: PKMSyncTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PKMSync.app/Contents/MacOS/PKMSync"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
    dependencies:
      - target: PKMSync

schemes:
  PKMSync:
    build:
      targets:
        PKMSync: all
        PKMSyncTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      environmentVariables:
        # Stops the Swift cooperative pool from growing past the core count.
        # A dev machine has enough cores to paper over code that blocks a
        # cooperative thread; the 3-core CI runner does not, which is how a
        # ProcessRunner hang got all the way to CI. This makes the local suite
        # fail the same way instead.
        LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
      coverageTargets:
        - PKMSync
      targets:
        - name: PKMSyncTests
          parallelizable: true
          randomExecutionOrder: true
    archive:
      config: Release
