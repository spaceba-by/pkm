name: iOS Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-*.yml'

concurrency:
  group: ios-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Homebrew tools
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/swiftlint--*
          key: ${{ runner.os }}-brew-lint-${{ hashFiles('.github/workflows/ios-test.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-lint-

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        working-directory: ios
        run: swiftlint lint --strict --reporter github-actions-logging

  build-and-test:
    name: Build & Test
    runs-on: macos-26

    env:
      SCHEME: PKMReader
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Cache Homebrew tools
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/xcodegen--*
            ~/Library/Caches/Homebrew/xcbeautify--*
          key: ${{ runner.os }}-brew-build-${{ hashFiles('.github/workflows/ios-test.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-build-

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-${{ hashFiles('.github/workflows/ios-test.yml') }}-${{ hashFiles('ios/PKMReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('ios/PKMReader/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-dd-${{ hashFiles('.github/workflows/ios-test.yml') }}-${{ hashFiles('ios/PKMReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            ${{ runner.os }}-dd-${{ hashFiles('.github/workflows/ios-test.yml') }}-

      - name: Boot simulator
        run: |
          # Pre-boot the simulator to avoid boot time during tests
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 17" | grep "26.0" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -n "$DEVICE_ID" ]; then
            echo "Booting simulator $DEVICE_ID"
            xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
            # Wait for boot to complete
            xcrun simctl bootstatus "$DEVICE_ID" -b 2>/dev/null || true
          fi

      - name: Build for testing
        working-directory: ios
        run: |
          xcodebuild build-for-testing \
            -project PKMReader.xcodeproj \
            -scheme $SCHEME \
            -destination "$DESTINATION" \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Run tests
        working-directory: ios
        run: |
          xcodebuild test-without-building \
            -project PKMReader.xcodeproj \
            -scheme $SCHEME \
            -destination "$DESTINATION" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/all-tests.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ios/TestResults/
          retention-days: 14

      - name: Generate coverage report
        if: always()
        working-directory: ios
        run: |
          if [ -d "TestResults/all-tests.xcresult" ]; then
            xcrun xccov view --report --json TestResults/all-tests.xcresult > coverage.json
            COVERAGE=$(cat coverage.json | jq '.lineCoverage * 100 | floor')
            echo "## Code Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::No test results found, skipping coverage report"
          fi

      - name: Check coverage threshold
        if: always()
        working-directory: ios
        run: |
          if [ ! -f "coverage.json" ]; then
            echo "::warning::No coverage data available"
            exit 0
          fi
          COVERAGE=$(cat coverage.json | jq '.lineCoverage * 100')
          THRESHOLD=20
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Code coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
