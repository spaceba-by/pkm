name: iOS Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-*.yml'

concurrency:
  group: ios-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          working_directory: ios

      - name: Format Check
        run:  mise run format:check
        working-directory: ios

  lint:
    name: Lint
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Homebrew tools
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/swiftlint--*
          key: ${{ runner.os }}-brew-lint-${{ hashFiles('.github/workflows/ios-test.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-lint-

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        working-directory: ios
        run: swiftlint lint --strict --reporter github-actions-logging

  build:
    name: Build
    runs-on: macos-26

    env:
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17'
      DERIVED_DATA_PATH: /tmp/DerivedData

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      # Recent macos-26 runner images ship Xcode without the iOS platform
      # (SDK + simulator runtime) preinstalled, so building and booting a
      # simulator fail with "iOS 26.0 is not installed". Download it first.
      - name: Install iOS platform
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::downloadPlatform attempt $attempt failed (e.g. 'Unable to connect to simulator'); bouncing CoreSimulator and retrying"
              sudo pkill -9 -f CoreSimulator 2>/dev/null || true
              sleep 20
            fi
          done
          echo "::error::Failed to install iOS platform after 3 attempts"
          exit 1

      - uses: jdx/mise-action@v3
        with:
          working_directory: ios

      - name: Install tools
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: mise run generate

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: /tmp/DerivedData
          key: ${{ runner.os }}-dd-${{ hashFiles('ios/project.yml', 'ios/PKMReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('ios/PKMReader/**/*.swift', 'ios/PKMReaderTests/**/*.swift', 'ios/PKMReaderUITests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-dd-${{ hashFiles('ios/project.yml', 'ios/PKMReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            ${{ runner.os }}-dd-

      - name: Boot simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 17" | grep "26.0" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -n "$DEVICE_ID" ]; then
            echo "Booting simulator $DEVICE_ID"
            xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
            xcrun simctl bootstatus "$DEVICE_ID" -b 2>/dev/null || true
          fi

      - name: Build for testing
        working-directory: ios
        run: mise run ci:build

      - name: Tar DerivedData for upload
        run: tar -cf /tmp/derived-data.tar -C /tmp DerivedData

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: derived-data
          path: /tmp/derived-data.tar
          retention-days: 1

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: macos-26

    env:
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17'
      DERIVED_DATA_PATH: /tmp/DerivedData

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      # Recent macos-26 runner images ship Xcode without the iOS platform
      # (SDK + simulator runtime) preinstalled, so building and booting a
      # simulator fail with "iOS 26.0 is not installed". Download it first.
      - name: Install iOS platform
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::downloadPlatform attempt $attempt failed (e.g. 'Unable to connect to simulator'); bouncing CoreSimulator and retrying"
              sudo pkill -9 -f CoreSimulator 2>/dev/null || true
              sleep 20
            fi
          done
          echo "::error::Failed to install iOS platform after 3 attempts"
          exit 1

      - uses: jdx/mise-action@v3
        with:
          working_directory: ios

      - name: Install tools
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: mise run generate

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: derived-data
          path: /tmp

      - name: Restore DerivedData
        run: tar -xf /tmp/derived-data.tar -C /tmp

      - name: Boot simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 17" | grep "26.0" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -n "$DEVICE_ID" ]; then
            echo "Booting simulator $DEVICE_ID"
            xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
            xcrun simctl bootstatus "$DEVICE_ID" -b 2>/dev/null || true
          fi

      - name: Run unit tests
        working-directory: ios
        run: mise run ci:test:unit

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ios/TestResults/
          retention-days: 14

      - name: Check coverage
        if: always()
        working-directory: ios
        run: mise run ci:coverage

  ui-tests:
    name: UI Tests
    needs: build
    runs-on: macos-26

    env:
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17'
      DERIVED_DATA_PATH: /tmp/DerivedData

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      # Recent macos-26 runner images ship Xcode without the iOS platform
      # (SDK + simulator runtime) preinstalled, so building and booting a
      # simulator fail with "iOS 26.0 is not installed". Download it first.
      - name: Install iOS platform
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::downloadPlatform attempt $attempt failed (e.g. 'Unable to connect to simulator'); bouncing CoreSimulator and retrying"
              sudo pkill -9 -f CoreSimulator 2>/dev/null || true
              sleep 20
            fi
          done
          echo "::error::Failed to install iOS platform after 3 attempts"
          exit 1

      - uses: jdx/mise-action@v3
        with:
          working_directory: ios

      - name: Install tools
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: mise run generate

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: derived-data
          path: /tmp

      - name: Restore DerivedData
        run: tar -xf /tmp/derived-data.tar -C /tmp

      - name: Boot simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 17" | grep "26.0" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -n "$DEVICE_ID" ]; then
            echo "Booting simulator $DEVICE_ID"
            xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
            xcrun simctl bootstatus "$DEVICE_ID" -b 2>/dev/null || true
          fi

      - name: Run UI tests
        working-directory: ios
        run: mise run ci:test:ui

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: ios/TestResults/
          retention-days: 14

      - name: Check coverage
        if: always()
        working-directory: ios
        env:
          RESULT_BUNDLE_PATH: TestResults/ui-tests.xcresult
          COVERAGE_THRESHOLD: 30
        run: mise run ci:coverage
