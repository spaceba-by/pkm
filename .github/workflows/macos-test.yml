name: macOS Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'macos/**'
      - '.github/workflows/macos-*.yml'

concurrency:
  group: macos-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: macos-26
    # Runs in seconds; the cap only exists to stop a wedged runner burning the
    # 6h default at the macOS 10x billing multiplier.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          working_directory: macos

      - name: Format Check
        run: mise run format:check
        working-directory: macos

  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          working_directory: macos

      - name: Run SwiftLint
        working-directory: macos
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    name: Build & Test
    runs-on: macos-26
    # ~2 min with a warm DerivedData cache, ~8 min cold, so 20 leaves headroom
    # for a full rebuild while still failing fast if a test deadlocks.
    timeout-minutes: 20

    env:
      DERIVED_DATA_PATH: /tmp/DerivedData

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - uses: jdx/mise-action@v4
        with:
          working_directory: macos

      - name: Generate Xcode project
        working-directory: macos
        run: mise run generate

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: /tmp/DerivedData
          key: ${{ runner.os }}-macos-dd-${{ hashFiles('macos/project.yml') }}-${{ hashFiles('macos/PKMSync/**/*.swift', 'macos/PKMSyncTests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-macos-dd-${{ hashFiles('macos/project.yml') }}-
            ${{ runner.os }}-macos-dd-

      - name: Build and test
        working-directory: macos
        run: |
          set -o pipefail
          xcodebuild test \
            -project PKMSync.xcodeproj \
            -scheme PKMSync \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/unit-tests.xcresult \
            CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO 2>&1 \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-test-results
          path: macos/TestResults/
          retention-days: 14
