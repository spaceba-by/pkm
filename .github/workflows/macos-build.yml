name: macOS Build

on:
  push:
    branches: [main]
    tags:
      - 'macos-v*'
    # No `paths:` filter here on purpose. A paths filter applies to tag pushes
    # too, so tagging a commit that did not itself touch macos/** would silently
    # skip the whole workflow and never cut the release. Builds are ~1m and this
    # repo is public (free runner minutes), so we always build instead.
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump for this release
        type: choice
        options: [patch, minor, major]
        default: patch

# Every run that can publish a release (a dispatch or a macos-v* tag push)
# shares one group, so two of them never resolve the same version or upload
# to the same release at once. Ordinary pushes to main keep their own group,
# which also stops them replacing a queued release: a concurrency group only
# holds one pending run.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/macos-v'))
    && 'macos-build-release'
    || format('macos-build-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_release: ${{ steps.resolve.outputs.is_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version
        id: resolve
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/tags/macos-v*)
              version="${GITHUB_REF_NAME#macos-v}"
              ;;
            refs/heads/main)
              if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
                echo "Not a release; keeping the version from project.yml."
                echo "is_release=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              latest=$(git tag -l 'macos-v*' \
                | grep -E '^macos-v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sed 's/^macos-v//' | sort -V | tail -n 1 || true)
              if [ -z "$latest" ]; then
                # First release: bump from the version installed copies report.
                latest=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' macos/project.yml)
              fi

              IFS=. read -r major minor patch <<< "$latest"
              case "$BUMP" in
                major) version="$((major + 1)).0.0" ;;
                minor) version="$major.$((minor + 1)).0" ;;
                patch) version="$major.$minor.$((patch + 1))" ;;
                *) echo "::error::Unknown bump '$BUMP'"; exit 1 ;;
              esac
              ;;
            *)
              echo "::error::Releases must run from main or a macos-v* tag, not $GITHUB_REF"
              exit 1
              ;;
          esac

          # The app's version parser only understands major.minor.patch.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a major.minor.patch version"
            exit 1
          fi

          echo "Releasing macos-v$version"
          {
            echo "version=$version"
            echo "is_release=true"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build Release
    needs: version
    runs-on: macos-26
    # Generous because notarization waits on Apple's service, which can be slow;
    # still well under the 6h default this would otherwise inherit.
    timeout-minutes: 45

    steps:
      - name: Check signing secrets
        id: check-secrets
        run: |
          has_cert="${MACOS_CERTIFICATE:+1}"
          has_pass="${MACOS_CERTIFICATE_PASSWORD:+1}"
          has_team="${APPLE_TEAM_ID:+1}"

          if [ -z "$has_cert" ] && [ -z "$has_pass" ]; then
            echo "No code signing secrets detected; building unsigned."
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$has_cert" ] && [ -n "$has_pass" ] && [ -n "$has_team" ]; then
            echo "All code signing secrets detected; building signed."
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Partial code signing secrets detected. Set all or none of: MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, APPLE_TEAM_ID"
          exit 1
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Check notarization secrets
        id: check-notary
        if: steps.check-secrets.outputs.has_signing == 'true'
        run: |
          has_key_id="${ASC_KEY_ID:+1}"
          has_issuer="${ASC_ISSUER_ID:+1}"
          has_key="${ASC_KEY:+1}"

          if [ -n "$has_key_id" ] && [ -n "$has_issuer" ] && [ -n "$has_key" ]; then
            echo "has_notary=true" >> "$GITHUB_OUTPUT"
          else
            echo "Notarization secrets not configured; skipping notarization."
            echo "has_notary=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}

      # Installed apps replace themselves with whatever a release publishes, so a
      # release must never fall back to the unsigned or un-notarized path.
      - name: Require signing and notarization for releases
        if: >-
          needs.version.outputs.is_release == 'true' && (
          steps.check-secrets.outputs.has_signing != 'true' ||
          steps.check-notary.outputs.has_notary != 'true')
        run: |
          echo "::error::Releases must be signed and notarized. Check the MACOS_CERTIFICATE*, APPLE_TEAM_ID and ASC_* secrets."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - uses: jdx/mise-action@v4
        with:
          working_directory: macos

      - name: Generate Xcode project
        working-directory: macos
        run: mise run generate

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-macos-dd-${{ hashFiles('macos/project.yml') }}-${{ hashFiles('macos/PKMSync/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-macos-dd-${{ hashFiles('macos/project.yml') }}-
            ${{ runner.os }}-macos-dd-

      # --- Signed build path ---

      - name: Setup signing keychain
        if: steps.check-secrets.outputs.has_signing == 'true'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Fail here with a clear message rather than deep inside codesign:
          # the archive step signs against this exact identity name.
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -q "Developer ID Application"; then
            echo "::error::MACOS_CERTIFICATE imported but no 'Developer ID Application' identity found. Export the .p12 from Keychain Access with its private key."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      # Manual signing, not Automatic: the runner has no Apple ID signed into
      # Xcode, so automatic signing cannot resolve a profile. The app is
      # unsandboxed with no entitlements, so Developer ID needs no profile --
      # just the imported certificate.
      - name: Build signed archive
        if: steps.check-secrets.outputs.has_signing == 'true'
        working-directory: macos
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PKMSync.xcodeproj \
            -scheme PKMSync \
            -destination 'platform=macOS' \
            -archivePath build/PKMSync.xcarchive \
            -configuration Release \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            ${RELEASE_VERSION:+"MARKETING_VERSION=$RELEASE_VERSION"} 2>&1 \
            | xcbeautify --renderer github-actions
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}

      - name: Export signed app
        if: steps.check-secrets.outputs.has_signing == 'true'
        working-directory: macos
        run: |
          mkdir -p build/export
          cat > build/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/\${APPLE_TEAM_ID}/$APPLE_TEAM_ID/" build/ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath build/PKMSync.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize app
        if: steps.check-secrets.outputs.has_signing == 'true' && steps.check-notary.outputs.has_notary == 'true'
        working-directory: macos
        run: |
          # Create API key file for notarytool. ASC_KEY holds the base64 of the
          # .p8 (that is what fastlane's is_key_content_base64 expects in
          # ios-build.yml), so it has to be decoded before notarytool sees it --
          # handing it the raw base64 fails with "Error: invalidPEMDocument".
          KEY_PATH=~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          mkdir -p ~/.private_keys

          if ! echo "$ASC_KEY" | base64 --decode > "$KEY_PATH"; then
            echo "::error::ASC_KEY is not valid base64 and could not be decoded. Store it as: base64 -i AuthKey_XXXXXXXXXX.p8"
            exit 1
          fi
          chmod 600 "$KEY_PATH"

          # Fail here with an actionable message rather than inside notarytool,
          # which only reports that the document was not PEM. Both envelope
          # lines are matched whole (-x), so a truncated decode or a stray
          # mention of the header inside the payload cannot pass this.
          if ! grep -qxF -- "-----BEGIN PRIVATE KEY-----" "$KEY_PATH" \
            || ! grep -qxF -- "-----END PRIVATE KEY-----" "$KEY_PATH"; then
            echo "::error::ASC_KEY decoded, but the result is not a PKCS#8 PEM private key. Store the base64 of the .p8 exactly as downloaded from App Store Connect: base64 -i AuthKey_XXXXXXXXXX.p8"
            exit 1
          fi

          # Create zip for notarization
          ditto -c -k --keepParent build/export/PKMSync.app build/PKMSync-notarize.zip

          xcrun notarytool submit build/PKMSync-notarize.zip \
            --key "$KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait

          xcrun stapler staple build/export/PKMSync.app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}

      # --- Unsigned build path (fallback) ---

      - name: Build (unsigned)
        if: steps.check-secrets.outputs.has_signing != 'true'
        working-directory: macos
        run: |
          set -o pipefail
          xcodebuild build \
            -project PKMSync.xcodeproj \
            -scheme PKMSync \
            -destination 'platform=macOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO 2>&1 \
            | xcbeautify --renderer github-actions

      # --- Package and upload ---

      - name: Create DMG and update zip
        if: steps.check-secrets.outputs.has_signing == 'true'
        working-directory: macos
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          APP_PATH="build/export/PKMSync.app"
          DMG_PATH="build/PKMSync.dmg"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")

          # An app that reports an older version than its tag would be offered
          # the same update forever.
          if [ -n "$RELEASE_VERSION" ] && [ "$VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Built app reports version $VERSION but this release is $RELEASE_VERSION"
            exit 1
          fi

          # Zipped here, after stapling, so the notarization ticket ships with the
          # app. The zip made for notarytool predates the ticket. Self-update reads
          # this one: it unpacks with ditto and expects PKMSync.app at the top level.
          ditto -c -k --keepParent "$APP_PATH" build/PKMSync.zip

          hdiutil create -volname "PKMSync $VERSION" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create build info
        run: |
          mkdir -p macos/build
          echo "{\"commit\": \"${{ github.sha }}\", \"branch\": \"${{ github.ref_name }}\", \"date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"signed\": ${{ steps.check-secrets.outputs.has_signing }}}" > macos/build/build-info.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PKMSync-${{ github.sha }}
          path: |
            macos/build/PKMSync.dmg
            macos/build/PKMSync.zip
            macos/build/build-info.json
          retention-days: 30

    outputs:
      has_signing: ${{ steps.check-secrets.outputs.has_signing }}
      has_notary: ${{ steps.check-notary.outputs.has_notary }}

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.version.outputs.is_release == 'true'

    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: PKMSync-${{ github.sha }}
          path: artifacts/

      # Publishing to a tag that already exists keeps the tag where it is and
      # overwrites that release's assets with this build. Refuse unless the tag
      # already points at the commit built here (a tag push, or a re-run).
      - name: Check release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="macos-v$RELEASE_VERSION"

          if ! ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2> "$RUNNER_TEMP/tag-lookup.err"); then
            if grep -q "HTTP 404" "$RUNNER_TEMP/tag-lookup.err"; then
              echo "$tag does not exist yet; publishing creates it at $GITHUB_SHA."
              exit 0
            fi
            cat "$RUNNER_TEMP/tag-lookup.err" >&2
            echo "::error::Could not look up $tag"
            exit 1
          fi

          type=$(jq -r '.object.type' <<< "$ref")
          sha=$(jq -r '.object.sha' <<< "$ref")
          # An annotated tag points at a tag object; follow it to the commit.
          while [ "$type" = "tag" ]; do
            obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha")
            type=$(jq -r '.object.type' <<< "$obj")
            sha=$(jq -r '.object.sha' <<< "$obj")
          done

          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::$tag already points at $sha, but this run built $GITHUB_SHA. Not overwriting that release."
            exit 1
          fi
          echo "$tag already points at $GITHUB_SHA; updating its release."

      # Creates the tag on a manual run, so a failed build leaves no tag behind
      # to be skipped over. A tag made with GITHUB_TOKEN does not retrigger this
      # workflow, so this cannot build twice.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "PKMSync v${{ needs.version.outputs.version }}"
          tag_name: macos-v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/PKMSync.dmg
            artifacts/PKMSync.zip
