name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-*.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Release
    runs-on: macos-26

    env:
      SCHEME: PKMReader

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/PKMReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-${{ hashFiles('ios/PKMReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('ios/PKMReader/**/*.swift', 'ios/PKMReaderTests/**/*.swift', 'ios/PKMReaderUITests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-dd-${{ hashFiles('ios/PKMReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            ${{ runner.os }}-dd-

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Install Fastlane
        working-directory: ios
        run: |
          gem install bundler
          bundle install

      # ============================================================
      # Code Signing Steps (uncomment when ready for App Store)
      # Prerequisites: Configure these GitHub Secrets:
      #   - MATCH_GIT_URL: Private Git repo URL for certificates
      #   - MATCH_PASSWORD: Passphrase for Match encryption
      #   - MATCH_GIT_BASIC_AUTHORIZATION: Base64 username:token
      # See docs/CODE_SIGNING.md for full setup instructions.
      # ============================================================
      #
      # - name: Setup signing keychain
      #   run: |
      #     security create-keychain -p "" build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p "" build.keychain
      #     security set-keychain-settings -t 3600 -u build.keychain
      #
      # - name: Sync code signing certificates
      #   working-directory: ios
      #   env:
      #     MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      #     MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      #     MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      #     MATCH_KEYCHAIN_NAME: build.keychain
      #     MATCH_KEYCHAIN_PASSWORD: ""
      #   run: bundle exec fastlane match appstore --readonly

      - name: Build archive (simulator only, unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          NSUnbufferedIO=YES \
          xcodebuild build \
            -project PKMReader.xcodeproj \
            -scheme $SCHEME \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO 2>&1 \
            | xcbeautify --renderer github-actions

      # Uncomment below and remove the unsigned build step above
      # when code signing is configured:
      #
      # - name: Build signed archive
      #   working-directory: ios
      #   env:
      #     BUILD_NUMBER: ${{ github.run_number }}
      #   run: bundle exec fastlane build_release

      - name: Create build info
        run: |
          mkdir -p ios/build
          echo "{\"commit\": \"${{ github.sha }}\", \"branch\": \"${{ github.ref_name }}\", \"date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > ios/build/build-info.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PKMReader-${{ github.sha }}
          path: |
            ios/build/
          retention-days: 30

    outputs:
      build_number: ${{ github.run_number }}

  # TestFlight deployment (commented out until Phase 4)
