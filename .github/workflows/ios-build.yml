name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-*.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Release
    runs-on: macos-26

    env:
      SCHEME: PKMReader

    steps:
      - name: Check signing secrets
        id: check-secrets
        run: |
          has_url="${MATCH_GIT_URL:+1}"
          has_pass="${MATCH_PASSWORD:+1}"
          has_auth="${MATCH_GIT_BASIC_AUTHORIZATION:+1}"

          if [ -z "$has_url" ] && [ -z "$has_pass" ] && [ -z "$has_auth" ]; then
            echo "No code signing secrets detected; building unsigned."
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$has_url" ] && [ -n "$has_pass" ] && [ -n "$has_auth" ]; then
            echo "All code signing secrets detected; building signed."
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Partial code signing secrets detected. Set all or none of: MATCH_GIT_URL, MATCH_PASSWORD, MATCH_GIT_BASIC_AUTHORIZATION"
          exit 1
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      # Recent macos-26 runner images ship Xcode without the iOS device
      # platform preinstalled (platforms are now downloadable components).
      # Without this, `xcodebuild archive -destination generic/platform=iOS`
      # fails with "iOS 26.0 is not installed".
      - name: Install iOS platform
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            echo "::warning::downloadPlatform attempt $attempt failed (e.g. 'Unable to connect to simulator'); bouncing CoreSimulator and retrying"
            sudo pkill -9 -f CoreSimulator 2>/dev/null || true
            sleep 20
          done
          echo "::error::Failed to install iOS platform after 3 attempts"
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/PKMReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-${{ hashFiles('ios/PKMReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('ios/PKMReader/**/*.swift', 'ios/PKMReaderTests/**/*.swift', 'ios/PKMReaderUITests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-dd-${{ hashFiles('ios/PKMReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            ${{ runner.os }}-dd-

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Install Fastlane
        working-directory: ios
        run: |
          gem install bundler
          bundle install

      # ============================================================
      # Code Signing (only when secrets are configured)
      # Prerequisites: Configure these GitHub Secrets:
      #   - MATCH_GIT_URL: Private Git repo URL for certificates
      #   - MATCH_PASSWORD: Passphrase for Match encryption
      #   - MATCH_GIT_BASIC_AUTHORIZATION: Base64 username:token
      # See docs/CODE_SIGNING.md for full setup instructions.
      # ============================================================

      - name: Setup signing keychain
        if: steps.check-secrets.outputs.has_signing == 'true'
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

      - name: Sync code signing certificates
        if: steps.check-secrets.outputs.has_signing == 'true'
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_KEYCHAIN_NAME: build.keychain
          MATCH_KEYCHAIN_PASSWORD: ""
        run: bundle exec fastlane match appstore --readonly

      - name: Build signed archive
        if: steps.check-secrets.outputs.has_signing == 'true'
        working-directory: ios
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_KEYCHAIN_NAME: build.keychain
          MATCH_KEYCHAIN_PASSWORD: ""
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 30
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 6
        run: bundle exec fastlane build_release

      # Unsigned simulator build (fallback when secrets are not configured)
      - name: Build (simulator only, unsigned)
        if: steps.check-secrets.outputs.has_signing != 'true'
        working-directory: ios
        run: |
          set -o pipefail
          NSUnbufferedIO=YES \
          xcodebuild build \
            -project PKMReader.xcodeproj \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO 2>&1 \
            | xcbeautify --renderer github-actions

      - name: Create build info
        run: |
          mkdir -p ios/build
          echo "{\"commit\": \"${{ github.sha }}\", \"branch\": \"${{ github.ref_name }}\", \"date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"signed\": ${{ steps.check-secrets.outputs.has_signing }}}" > ios/build/build-info.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PKMReader-${{ github.sha }}
          path: |
            ios/build/
          retention-days: 30

    outputs:
      build_number: ${{ github.run_number }}
      has_signing: ${{ steps.check-secrets.outputs.has_signing }}

  deploy-testflight:
    name: Deploy to TestFlight
    needs: build
    runs-on: macos-26
    environment: testflight
    if: github.ref == 'refs/heads/main' && needs.build.outputs.has_signing == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: PKMReader-${{ github.sha }}
          path: ios/build/

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Validate IPA artifact
        working-directory: ios
        run: |
          if [ ! -f "build/PKMReader.ipa" ]; then
            echo "::error::IPA not found at build/PKMReader.ipa"
            ls -R build/ || true
            exit 1
          fi

      - name: Upload to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.ASC_KEY }}
        run: bundle exec fastlane upload_testflight
